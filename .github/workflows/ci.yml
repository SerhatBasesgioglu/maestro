name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.15"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies and supported extras
        run: >-
          uv sync --locked --extra iis --extra windows --extra nexus --extra openbao
          --extra azure-devops --extra argocd --extra sonarqube --extra linux
        shell: bash

      - name: Ruff lint
        run: uv run --no-sync ruff check .
        shell: bash

      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
        shell: bash

      - name: Strict type check
        run: uv run --no-sync mypy
        shell: bash

      - name: Test with coverage
        run: |
          set -euo pipefail
          mkdir -p test-results
          uv run --no-sync pytest --cov=maestro --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=95 --junitxml=test-results/junit.xml
        shell: bash

      - name: Build distributions
        run: uv run --no-sync python -m build --no-isolation
        shell: bash

      - name: Upload CI diagnostics and distributions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-results-python-${{ matrix.python-version }}
          path: |
            test-results/junit.xml
            coverage.xml
            dist/
          if-no-files-found: warn
          retention-days: 14
